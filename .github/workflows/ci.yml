name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Compile Python source
        run: python3 -m py_compile app/book_publish_forge_app.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
