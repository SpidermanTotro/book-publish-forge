name: Book Publish Forge web checks

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: React tests and production build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run web unit tests
        env:
          CI: "true"
        run: npm test -- --watch=false --runInBand
      - name: Build production web assets
        env:
          CI: "true"
        run: npm run build
